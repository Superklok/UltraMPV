# --- Tightened Micro-Seeking (Small Time Increments) ---
RIGHT seek  1 exact                   # Advances the video by exactly 1 second
LEFT  seek -1 exact                   # Reverses the video by exactly 1 second

# --- Standard Seeking Fallbacks (Shift + Arrows) ---
SHIFT+RIGHT seek  5 exact             # Standard 5-second advance when holding Shift
SHIFT+LEFT  seek -5 exact             # Standard 5-second reverse when holding Shift

# --- Frame-Perfect Stepping (Up/Down Arrows) ---
UP    frame-step                      # Advances exactly 1 frame forward
DOWN  frame-back-step                 # Steps exactly 1 frame backward

# --- Clipping (Local Files ONLY) ---
r script-binding clip_toggle          # Presssing the "r" key toggles local file clip recording on/off